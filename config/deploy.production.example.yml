# Local production overlay — copy to deploy.production.yml (gitignored) and edit.
#
#   cp config/deploy.production.example.yml config/deploy.production.yml
#
# Platform template (servers, accessories): momoi-labs/infra/apps/analisehumornoticias/
# Deploy via infra repo CI. Local deploy:
#
#   sed "s/__KAMAL_SERVER_IP__/${KAMAL_SERVER_IP}/g" \
#     ../infra/apps/analisehumornoticias/deploy.production.template.yml \
#     > config/deploy.production.yml
#   bin/kamal deploy -d production
#
# Secrets: org secrets (infra) or export locally — see infra/docs/deploy-analisehumornoticias.md

servers:
  web:
    - YOUR_SERVER_IP
  job:
    hosts:
      - YOUR_SERVER_IP

builder:
  remote: ssh://root@YOUR_SERVER_IP

ssh:
  user: root
  keys:
    - ~/.ssh/id_ed25519
  keys_only: true

accessories:
  db:
    host: YOUR_SERVER_IP
    image: postgres:18
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: analisehumornoticias
        POSTGRES_DB: analisehumornoticias_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql

  redis:
    host: YOUR_SERVER_IP
    image: valkey/valkey:8
    port: "127.0.0.1:6379:6379"
    directories:
      - data:/data
